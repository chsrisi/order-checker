<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin Orders Prototype, round 4</title>
<!--
  Round 2 (2026-11-24) of the Order Checker admin "Orders" page prototype. Vanilla JS, no deps,
  mock data inlined (same as mock-orders.json). Actions are simulated in memory.
  Round-2 changes (see SPEC.md §9):
    R2.1 order cards are expanded by default; packed and hand-ticked cards collapse by default
    R4   picking states counted by SKUs touched; split orders are "partly packed" until every package is scanned;
         History "By close" pairs each order with its scans; one search box across History, with an exact-match answer
    R3   packed orders sink to the bottom of their status group, under a "Packed" divider (all layouts)
    R2.3 desktop "Paired rows" layout: each outbound scan sits in the same row as the order it packs;
         stray scans (no ongoing order) get their own section. "Two lists" keeps the round-1 layout.
  Resize below 768px for the mobile layout.
-->
<style>
:root {
  --bg: #f7f7f9; --card: #fff; --text: #1f2225; --muted: #6b7075; --border: rgba(128,128,128,.25);
  --primary: #18a058; --primary-soft: rgba(24,160,88,.12); --warn: #b7791f; --warn-soft: rgba(240,160,32,.14);
  --error: #d03050; --error-soft: rgba(208,48,80,.12); --neutral-soft: rgba(128,128,128,.12); --unclaimed: rgba(128,128,128,.08);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #101014; --card: #18181c; --text: #e8e8ea; --muted: #9a9ca0; --border: rgba(255,255,255,.12);
  --primary: #63e2b7; --primary-soft: rgba(99,226,183,.14); --warn: #f2c97d; --warn-soft: rgba(242,201,125,.14);
  --error: #e88080; --error-soft: rgba(232,128,128,.14); --neutral-soft: rgba(255,255,255,.08); --unclaimed: rgba(255,255,255,.04);
} }
:root[data-theme="dark"] {
  --bg: #101014; --card: #18181c; --text: #e8e8ea; --muted: #9a9ca0; --border: rgba(255,255,255,.12);
  --primary: #63e2b7; --primary-soft: rgba(99,226,183,.14); --warn: #f2c97d; --warn-soft: rgba(242,201,125,.14);
  --error: #e88080; --error-soft: rgba(232,128,128,.14); --neutral-soft: rgba(255,255,255,.08); --unclaimed: rgba(255,255,255,.04);
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, input, select { font: inherit; color: inherit; }
.shell { display: grid; grid-template-columns: 200px 1fr; min-height: 100vh; }
nav.side { border-right: 1px solid var(--border); background: var(--card); padding: 14px 10px; }
nav.side .brand { font-weight: 700; padding: 4px 10px 14px; }
nav.side a { display: block; padding: 8px 10px; border-radius: 6px; color: var(--muted); text-decoration: none; }
nav.side a.on { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
main { padding: 16px 20px; min-width: 0; }
.topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
.topbar h1 { font-size: 20px; margin: 0; }
.live { font-size: 12px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
.live::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--primary); }
.tabs { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--border); margin-bottom: 12px; }
.tablist { display: flex; gap: 18px; }
.tablist button { all: unset; cursor: pointer; padding: 8px 2px; color: var(--muted); border-bottom: 2px solid transparent; }
.tablist button.on { color: var(--primary); border-color: var(--primary); }
.split { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 20px; align-items: start; }
.col { min-width: 0; max-height: calc(100vh - 150px); overflow-y: auto; padding-right: 4px; }
.toolbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.title { font-weight: 600; font-size: 16px; }
.btn { border: 1px solid var(--border); background: var(--card); border-radius: 4px; padding: 5px 12px; cursor: pointer; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.danger { background: var(--error); border-color: var(--error); color: #fff; }
.btn.block { width: 100%; padding: 8px; }
.btn.sm { padding: 2px 10px; font-size: 13px; }
.btn.text { border: 0; background: none; color: var(--primary); padding: 2px 4px; }
.btn.quiet { border: 0; background: none; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0 6px; }
.filters input[type=search], .filters input[type=text] { flex: 1 1 220px; }
input[type=search], input[type=text], input[type=date], select { border: 1px solid var(--border); background: var(--card); border-radius: 4px; padding: 4px 8px; font-size: 13px; min-width: 0; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 4px; overflow: hidden; }
.seg button { all: unset; cursor: pointer; padding: 3px 10px; font-size: 13px; background: var(--card); }
.seg button + button { border-left: 1px solid var(--border); }
.seg button.on { background: var(--primary-soft); color: var(--primary); }
.switch { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
.count { display: block; font-size: 13px; color: var(--muted); margin-bottom: 8px; }
.muted { color: var(--muted); }
.mono { font-family: ui-monospace, monospace; word-break: break-all; }
.tag { display: inline-block; font-size: 12px; padding: 0 8px; border-radius: 3px; line-height: 20px; background: var(--neutral-soft); white-space: nowrap; }
.tag.round { border-radius: 10px; }
.tag.success { background: var(--primary-soft); color: var(--primary); }
.tag.warning { background: var(--warn-soft); color: var(--warn); }
.tag.error { background: var(--error-soft); color: var(--error); }
.tag.check { cursor: pointer; font-size: 13px; line-height: 24px; }
.tag.check.on { background: var(--primary); color: #fff; }
.group { all: unset; box-sizing: border-box; width: 100%; display: flex; justify-content: space-between; padding: 8px 4px; font-weight: 600; cursor: pointer; }
.group.warn { color: var(--warn); }
.card { border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; background: var(--card); }
.card.unclaimed { background: var(--unclaimed); }
.card.done .sn { text-decoration: line-through; }
.card .head { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; cursor: pointer; }
.card .main { flex: 1; min-width: 0; }
.line1 { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.line2 { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 4px; font-size: 13px; }
.code { color: var(--error); font-weight: 700; }
.recipient { display: block; font-size: 13px; margin-top: 2px; color: var(--muted); }
.chev { font-size: 20px; line-height: 1; opacity: .6; transition: transform .15s; }
.chev.open { transform: rotate(90deg); }
.lines { border-top: 1px solid var(--border); padding: 8px 12px 10px 44px; }
.sku { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 4px 0; }
input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--primary); margin: 2px 0 0; }
.scan { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 6px; cursor: pointer; background: var(--card); }
.scan.on { border-color: var(--error); }
.scan .body { flex: 1; min-width: 0; }
.scan .meta { font-size: 13px; color: var(--muted); }
.tagrow { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 8px; }
.select-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 2px 8px; font-size: 13px; }
.footer { position: sticky; bottom: 0; padding: 10px 0 0; background: var(--bg); }
.alert { border-radius: 4px; padding: 8px 12px; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 8px; font-size: 13px; }
.alert.success { background: var(--primary-soft); }
.alert.warning { background: var(--warn-soft); }
.empty { text-align: center; color: var(--muted); padding: 28px 0; }
.close { border: 1px solid var(--border); border-radius: 6px; margin-bottom: 8px; background: var(--card); }
.close .head { all: unset; box-sizing: border-box; width: 100%; display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; padding: 10px 12px; cursor: pointer; }
.close .when { font-weight: 600; min-width: 140px; }
.close .body { border-top: 1px solid var(--border); padding: 10px 12px; }
.cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.row { display: flex; justify-content: space-between; flex-wrap: wrap; gap: 4px 12px; padding: 8px 4px; border-bottom: 1px solid var(--border); }
.row.sm { padding: 3px 0; font-size: 13px; border: 0; }
.backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.modal { background: var(--card); border-radius: 8px; padding: 18px 20px; width: min(520px, 100%); max-height: 90vh; overflow-y: auto; box-shadow: 0 10px 40px rgba(0,0,0,.3); }
.modal h3 { margin: 0 0 10px; font-size: 17px; }
.modal table { width: 100%; border-collapse: collapse; font-size: 13px; }
.modal td, .modal th { padding: 5px 8px; border-bottom: 1px solid var(--border); text-align: left; }
.modal .actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
.menu { position: relative; }
.menu .pop { position: absolute; right: 0; top: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 6px; box-shadow: 0 4px 16px rgba(0,0,0,.15); padding: 4px; z-index: 5; white-space: nowrap; }
.menu .pop button { all: unset; display: block; padding: 6px 12px; cursor: pointer; border-radius: 4px; }
.menu .pop button:hover { background: var(--neutral-soft); }
.toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 16px; border-radius: 6px; font-size: 13px; z-index: 20; }
.proto-note { font-size: 12px; color: var(--muted); margin: 0 0 10px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

/* ---- round 2: paired rows ---- */
.paired { display: flex; flex-direction: column; height: calc(100vh - 160px); min-height: 520px; }
.phead, .prow, .pfoot { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); column-gap: 20px; }
.phead { border-bottom: 1px solid var(--border); margin-bottom: 4px; }
.phead > div { min-width: 0; }
.pbody { flex: 1; overflow-y: auto; padding-right: 4px; }
.prow { align-items: stretch; }
.prow > * { min-width: 0; }
.prow.span > * { grid-column: 1 / -1; }
.slot { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.slot .scan { margin-bottom: 0; }
.slot-notes { display: flex; gap: 6px; flex-wrap: wrap; }
.slot.empty { border: 1px dashed var(--border); border-radius: 6px; padding: 10px 12px; color: var(--muted); font-size: 13px; justify-content: center; align-self: start; }
.slot.empty.wait { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }
.slot.empty.stray { border-color: var(--warn); color: var(--warn); }
.prow:hover .card, .prow:hover .scan, .prow:hover .slot.empty { border-color: var(--primary); }
.prow:hover .scan.on { border-color: var(--error); }
.pdivider { display: flex; align-items: center; gap: 8px; margin: 4px 0 8px; font-size: 12px; color: var(--muted); }
.pdivider::before, .pdivider::after { content: ""; flex: 1; border-top: 1px dashed var(--border); }
.hsearch input { width: 100%; font-size: 16px; padding: 8px 12px; margin-top: 2px; }
.answer { border: 1px solid var(--primary); background: var(--primary-soft); border-radius: 6px; padding: 10px 12px; margin: 2px 0 10px; display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.answer.neutral { border-color: var(--border); background: var(--card); }
.hpair { display: grid; grid-template-columns: minmax(0,1fr) minmax(0,1fr); gap: 16px; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
.hpair.hhead { font-size: 12px; font-weight: 600; color: var(--muted); padding-top: 0; }
.hpair .meta { font-size: 12px; color: var(--muted); }
.hscan + .hscan { margin-top: 6px; }
.hsub { color: var(--warn); font-weight: 600; font-size: 13px; padding: 12px 0 2px; }
mark { background: var(--warn-soft); color: inherit; border-radius: 2px; padding: 0 1px; }
@media (max-width: 600px) { .hpair { grid-template-columns: 1fr; gap: 2px; } .hpair.hhead { display: none; } }
.pfoot { border-top: 1px solid var(--border); padding-top: 8px; align-items: end; }
.foot-note { font-size: 12px; margin-bottom: 6px; }
.scans-in-card { margin-top: 6px; font-size: 13px; }

@media (max-width: 767px) {
  .shell { grid-template-columns: 1fr; }
  nav.side { display: flex; gap: 2px; overflow-x: auto; padding: 8px; border-right: 0; border-bottom: 1px solid var(--border); }
  nav.side .brand { display: none; }
  nav.side a { white-space: nowrap; }
  main { padding: 12px 16px; }
  .col { max-height: none; overflow: visible; }
}
</style>

    if (S.collapsed.has(g.status)) continue;
    const ord = g.items.map((x) => x.o);
    rows += g.items.map(({ o, sc }, i) => (packedDivider(ord, i, ctx.packed) ? `<div class="prow span">${packedDivider(ord, i, ctx.packed)}</div>` : '') + `<div class="prow">
      <div>${orderCard(o, ctx.packed.has(o.order_sn), S.ticked.has(o.order_sn), false)}</div>${scanSlot(o, sc)}</div>`).join('');
  }
  if (!rows) rows = !S.orders.length && !S.scans.length ? `<div class="empty">No ongoing orders and no open scans.</div>`
    : `<div class="empty">Nothing matches the filters.<br><button class="btn sm" data-a="clear" style="margin-top:8px">Clear filters</button></div>`;
  const tc = toClose(), shownIds = new Set(m.shown.map((s) => s.id)), hidden = tc.filter((s) => !shownIds.has(s.id)).length;
  const waiting = ctx.filtered.filter((o) => !ctx.packed.has(o.order_sn) && !S.ticked.has(o.order_sn) && progress(o, S.picks).state === 'done').length;
  return `<div class="paired">
    <div class="phead"><div>${ongoingHeader(ctx)}</div><div>${outboundHeader(m.shown)}</div></div>
    <div class="pbody">${rows}</div>
    <div class="pfoot">
      <div class="muted foot-note">${m.strays.length} scan${m.strays.length === 1 ? '' : 's'} with no ongoing order · ${waiting} picked, waiting for a scan</div>
      <div>${hidden ? `<div class="muted foot-note">${hidden} scan${hidden === 1 ? '' : 's'} in this close ${hidden === 1 ? 'is' : 'are'} not on screen (order filters or a collapsed group).</div>` : ''}${closeButton()}</div>
    </div></div>`;
}

function closeDialog() {
  const scans = toClose(), labels = new Set(scans.map((s) => norm(s.content)));
  const doneOrders = S.orders.filter((o) => labelsOf(o).some((l) => labels.has(l)));
  const partial = doneOrders.map((o) => ({ o, c: partialPackages(o, scans) })).filter((x) => x.c);
  const strays = strayScans(S.orders, scans).length;
  const shownIds = new Set((pairedMode() ? pairedModel().shown : S.scans.filter(tagOk)).map((s) => s.id));
  const hidden = scans.filter((s) => !shownIds.has(s.id)).length;
  const scope = S.selected.size ? 'selected' : S.tag ? `“${esc(S.tag)}”` : 'open';
  const n = scans.length, d = doneOrders.length;
  return `<div class="backdrop" data-a="cancelclose"><div class="modal" data-stop>
    <h3>Close the period</h3>
    <p style="margin-top:0">Closes <strong>${n}</strong> ${scope} scan${n === 1 ? '' : 's'}. They move to History, and <strong>${d}</strong> ongoing order${d === 1 ? '' : 's'} whose label was scanned will be marked done.</p>
    ${partial.map(({ o, c }) => `<div class="alert warning"><span><strong class="mono">${o.order_sn}</strong>: only ${c.scanned} of ${c.total} packages are in this close. The server still marks it done (rule 6; open question in SPEC §13).</span></div>`).join('')}
    ${strays ? `<div class="alert warning"><span>${strays} scan${strays === 1 ? '' : 's'} with no ongoing order ${strays === 1 ? 'is' : 'are'} included.</span></div>` : ''}
    ${hidden ? `<div class="alert warning"><span>${hidden} of these scans ${hidden === 1 ? 'is' : 'are'} not on screen (order filters or a collapsed group).</span></div>` : ''}
    <table><thead><tr><th>Tag</th><th style="text-align:right">Scans</th></tr></thead>
      <tbody>${countByTag(scans).map(([t, k]) => `<tr><td>${esc(t)}</td><td style="text-align:right">${k}</td></tr>`).join('')}</tbody></table>
    <p class="muted">A scan with more than one tag counts under each. This cannot be undone.</p>
    <div class="actions"><button class="btn" data-a="cancelclose">Cancel</button><button class="btn danger" data-a="confirmclose">Close ${n} scan${n === 1 ? '' : 's'}</button></div>
  </div></div>`;
}
function resetDialog() {
  return `<div class="backdrop" data-a="cancelreset"><div class="modal" data-stop>
    <h3>Reset the Shopee sync state?</h3>
    <p style="margin-top:0">Use this after fixing the Shopee tokens in Settings. After a token error the server stops syncing; this clears that stop and the cached orders, then syncs again. Orders, picks and scans are not changed.</p>
    <div class="actions"><button class="btn" data-a="cancelreset">Cancel</button><button class="btn primary" data-a="confirmreset">Reset and sync</button></div>
  </div></div>`;
}
// ---------- History (R4: pairs inside a close, one search across the views) ----------
function hl(text, q) { // escape, then wrap case-insensitive matches of q in <mark>
  const s = String(text ?? ''); if (!q) return esc(s);
  const lo = s.toLowerCase(); let i = 0, j, out = '';
  while ((j = lo.indexOf(q, i)) !== -1) { out += esc(s.slice(i, j)) + '<mark>' + esc(s.slice(j, j + q.length)) + '</mark>'; i = j + q.length; }
  return out + esc(s.slice(i));
}
const hMatchOrder = (o, q) => [o.order_sn, pickupCode(o) || '', o.owner_user || '', o.shipping_carrier || '', (o.recipient_address || {}).name || '',
  ...(o.info || []).map((i) => i.tracking_number || '')].some((t) => t.toLowerCase().includes(q));
const hMatchScan = (s, q) => [s.content, s.owner_user || '', ...(s.tags || [])].some((t) => t.toLowerCase().includes(q));
function closePairs(closedAt) {
  const sc = S.history.closed_scans.filter((s) => s.closed_at === closedAt);
  const rows = S.history.orders_done.filter((o) => o.done_at === closedAt).map((o) => ({ o, sc: scansFor(o, sc) }));
  const used = new Set(rows.flatMap((r) => r.sc.map((s) => s.id)));
  return { rows, strays: sc.filter((s) => !used.has(s.id)) };
}
// exact SN / tracking number / label: answers "did X leave, and when?" (also what a barcode scanner types)
function lookup(q) {
  if (!q) return null;
  const hit = (o) => labelsOf(o).includes(q);
  let o = S.orders.find(hit);
  if (o) { const st = packState(o, S.scans);
    return { cls: 'neutral', html: `<strong class="mono">${esc(o.order_sn)}</strong> has not left yet. It is still ongoing: ${st === 'packed' ? 'packed, waiting for a close' : st === 'partial' ? 'partly packed' : 'not packed'} · ${esc(o.shipping_carrier || '—')} · ship by ${formatShort(o.ship_by)}.` }; }
  o = S.history.orders_done.find(hit);
  if (o) return { cls: '', close: o.done_at, html: `✓ <strong class="mono">${esc(o.order_sn)}</strong> left in the close of <strong>${formatShort(o.done_at)}</strong> · ${esc(o.shipping_carrier || '—')} · picked by ${esc(o.owner_user || 'unclaimed')}.` };
  const os = S.scans.find((s) => norm(s.content) === q);
  if (os) return { cls: 'neutral', html: `<strong class="mono">${esc(os.content)}</strong> was scanned at outbound ${formatShort(os.created_at)} by ${esc(os.owner_user || '—')} and is not closed yet. It matches no ongoing order.` };
  const cs = S.history.closed_scans.find((s) => norm(s.content) === q);
  if (cs) return { cls: '', close: cs.closed_at, html: `✓ <strong class="mono">${esc(cs.content)}</strong> left in the close of <strong>${formatShort(cs.closed_at)}</strong> (scanned by ${esc(cs.owner_user || '—')}). It matched no order, most often a Tokopedia package.` };
  return null;
}
function hOrderCell(o, q) {
  const code = pickupCode(o);
  return `<span class="mono">${hl(o.order_sn, q)}</span>${code ? ` <span class="code">${hl(code, q)}</span>` : ''}
    <div class="meta">${hl(o.shipping_carrier || '—', q)} · ${hl(o.owner_user || 'unclaimed', q)} · ${hl((o.recipient_address || {}).name || '—', q)}</div>`;
}
function hScanCell(s, q, closed) {
  return `<div class="hscan"><span class="mono">${hl(s.content, q)}</span> ${(s.tags || []).map((t) => `<span class="tag round">${hl(t, q)}</span>`).join(' ')}
    <div class="meta">${hl(s.owner_user || '—', q)} · scanned ${formatShort(s.created_at)}${closed ? ` · closed ${formatShort(s.closed_at)}` : ''}</div></div>`;
}
function closeBlock(x, q) {
  const H = S.h, c = x.c, key = c.closed_at;
  const open = q ? !H.shut.has(key) : H.open.has(key), showAll = !q || H.all.has(key);
  const rows = showAll ? x.allRows : x.rows, strays = showAll ? x.allStrays : x.strays;
  const more = x.allRows.length + x.allStrays.length - (x.rows.length + x.strays.length);
  const matches = x.rows.length + x.strays.length;
  return `<div class="close"><button class="head" data-a="hclose" data-k="${key}" aria-expanded="${open}">
    <span class="when">${open ? '▾' : '▸'} ${formatShort(key)}</span>
    <span>${c.outbound} scans <span class="muted">· ${c.orders_done} orders done</span></span>
    <span style="display:inline-flex;gap:4px;flex-wrap:wrap">${c.tags.map((t) => `<span class="tag round">${hl(t, q)}</span>`).join('')}</span>
    ${q ? `<span class="tag success">${matches} match${matches === 1 ? '' : 'es'}</span>` : ''}</button>
    ${open ? `<div class="body"><div class="hpair hhead"><span>Order done</span><span>Outbound scan</span></div>
      ${rows.map((r) => `<div class="hpair"><div>${hOrderCell(r.o, q)}</div><div>${r.sc.length ? r.sc.map((s) => hScanCell(s, q)).join('') : '<span class="muted">No scan with this order’s labels in this close</span>'}</div></div>`).join('')}
      ${strays.length ? `<div class="hsub">⚠ Scans with no order · ${strays.length} <span class="muted">(most often a Tokopedia package)</span></div>
        ${strays.map((s) => `<div class="hpair"><div class="muted">No order</div><div>${hScanCell(s, q)}</div></div>`).join('')}` : ''}
      ${q && (more > 0 || H.all.has(key)) ? `<button class="btn text sm" data-a="hall" data-k="${key}" style="margin-top:6px">${H.all.has(key) ? 'Show only the matching rows' : `Show all rows of this close (${more} more)`}</button>` : ''}
    </div>` : ''}</div>`;
}
function viewHistory() {
  const H = S.h, from = H.from ? new Date(H.from + 'T00:00').getTime() : -Infinity, to = H.to ? new Date(H.to + 'T23:59:59.999').getTime() : Infinity;
  const inRange = (iso) => { const t = new Date(iso).getTime(); return t >= from && t <= to; };
  const q = norm(H.q), ans = lookup(q);
  let body = '', total = 0, outside = 0;
  if (H.view === 'closes') {
    const all = S.history.closes.map((c) => { const p = closePairs(c.closed_at);
      return { c, allRows: p.rows, allStrays: p.strays,
        rows: q ? p.rows.filter((r) => hMatchOrder(r.o, q) || r.sc.some((s) => hMatchScan(s, q))) : p.rows,
        strays: q ? p.strays.filter((s) => hMatchScan(s, q)) : p.strays }; })
      .filter((x) => !q || x.rows.length || x.strays.length);
    const list = all.filter((x) => inRange(x.c.closed_at)); total = list.length; outside = all.length - total;
    body = list.map((x) => closeBlock(x, q)).join('');
  } else if (H.view === 'orders') {
    const all = S.history.orders_done.filter((o) => !q || hMatchOrder(o, q));
    const list = all.filter((o) => inRange(o.done_at)).sort((a, b) => b.done_at.localeCompare(a.done_at)); total = list.length; outside = all.length - total;
    body = list.map((o) => `<div class="row"><div>${hOrderCell(o, q)}</div><span class="muted">closed ${formatShort(o.done_at)}</span></div>`).join('');
  } else {
    const all = S.history.closed_scans.filter((s) => !q || hMatchScan(s, q));
    const list = all.filter((s) => inRange(s.closed_at)).sort((a, b) => b.closed_at.localeCompare(a.closed_at)); total = list.length; outside = all.length - total;
    body = list.map((s) => `<div class="row" style="display:block">${hScanCell(s, q, true)}</div>`).join('');
  }
  const noun = (total === 1 ? { closes: 'close', orders: 'order done', scans: 'closed scan' } : { closes: 'closes', orders: 'orders done', scans: 'closed scans' })[H.view];
  const ranged = H.from || H.to;
  return `<div>
    <div class="hsearch"><input type="search" data-i="hq" id="hq" value="${esc(H.q)}" placeholder="Search order SN, tracking number or label, pickup code, worker, courier, tag" aria-label="Search history (press / to focus)"></div>
    <div class="filters">
      <div class="seg">${[['closes', 'By close'], ['orders', 'Orders done'], ['scans', 'Closed scans']].map(([v, l]) => `<button data-a="hview" data-k="${v}" class="${H.view === v ? 'on' : ''}">${l}</button>`).join('')}</div>
      <input type="date" data-i="hfrom" value="${H.from}" title="Closed from"> <span class="muted">to</span> <input type="date" data-i="hto" value="${H.to}" title="to">
      <button class="btn text sm" data-a="h7">Last 7 days</button>${ranged ? `<button class="btn text sm" data-a="hdates">All dates</button>` : ''}
    </div>
    ${ans ? `<div class="answer ${ans.cls}"><span>${ans.html}</span>${ans.close && (H.view !== 'closes' || (ranged && !inRange(ans.close))) ? `<button class="btn sm" data-a="hgoto" data-k="${ans.close}">Show this close</button>` : ''}</div>` : ''}
    <span class="count">${total} ${noun}${q ? ' with a match' : ''}${ranged ? ' closed in the chosen days' : ''}${outside ? ` · ${outside} more outside them <button class="btn text sm" data-a="hdates">Search all dates</button>` : ''}</span>
    ${body || `<div class="empty">${q ? `Nothing in History matches “${esc(H.q.trim())}”.` : 'Nothing closed in this range.'}</div>`}
  </div>`;
}
function pruneSel() {
  const ids = new Set((pairedMode() ? pairedModel().shown : S.scans.filter(tagOk)).map((s) => s.id));
  S.selected = new Set([...S.selected].filter((id) => ids.has(id)));
}
function render() {
  if (S.tab !== 'history' && !S.closing) pruneSel(); // a selection never includes scans the admin can't see
  const app = document.getElementById('app');
  const focus = document.activeElement && document.activeElement.dataset.i, caret = focus && document.activeElement.selectionStart;
  const scrollEl = app.querySelector('.pbody'), scrollTop = scrollEl ? scrollEl.scrollTop : null;
  const tabs = S.mobile ? [['ongoing', 'Orders'], ['outbound', `Outbound (${S.scans.length})`], ['history', 'History']] : [['ongoing', 'Ongoing'], ['history', 'History']];
  const layoutSeg = !S.mobile && S.tab === 'ongoing' ? `<div class="seg" title="Desktop layout (prototype switch)">${[['paired', 'Paired rows (round 2)'], ['split', 'Two lists (round 1)']]
    .map(([v, l]) => `<button data-a="layout" data-k="${v}" class="${S.layout === v ? 'on' : ''}">${l}</button>`).join('')}</div>` : '';
  let body;
  if (S.tab === 'history') body = viewHistory();
  else if (S.mobile) body = S.tab === 'outbound' ? viewOutbound() : viewOngoing();
  else if (S.layout === 'paired') body = viewPaired();
  else body = `<div class="split"><div class="col">${viewOngoing()}</div><div class="col">${viewOutbound()}</div></div>`;
  app.innerHTML = `<div class="tabs"><div class="tablist">${tabs.map(([k, l]) => `<button data-a="tab" data-k="${k}" class="${S.tab === k ? 'on' : ''}">${l}</button>`).join('')}</div>${layoutSeg}</div>${body}${S.closing ? closeDialog() : ''}${S.resetting ? resetDialog() : ''}${S.toast ? `<div class="toast">${esc(S.toast)}</div>` : ''}`;
  const pb = app.querySelector('.pbody'); if (pb && scrollTop !== null) pb.scrollTop = scrollTop; // live frames must not reset the scroll (rule 8)
  if (focus) { const el = app.querySelector(`[data-i="${focus}"]`); if (el) { el.focus(); try { el.setSelectionRange(caret, caret); } catch {} } }
}

// ---------- events ----------
document.addEventListener('click', (e) => {
  const stop = e.target.closest('[data-stop]'), t = e.target.closest('[data-a]');
  if (!t) { if (S.moreMenu) { S.moreMenu = false; render(); } return; }
  if (stop && t.dataset.a === 'card') return; // a click on the tick box area doesn't toggle the card
  if ((t.dataset.a === 'cancelclose' || t.dataset.a === 'cancelreset') && e.target.closest('.modal') && !e.target.closest('button')) return;
  const k = t.dataset.k, a = t.dataset.a;
  if (a !== 'more') S.moreMenu = false;
  switch (a) {
    case 'tab': S.tab = k; break;
    case 'layout': S.layout = k; try { localStorage.setItem('oc.proto.layout', k); } catch {} break;
    case 'group': S.collapsed.has(k) ? S.collapsed.delete(k) : S.collapsed.add(k); break;
    case 'card': { const base = !isDoneLike(k); S.expand.set(k, { open: !isOpen(k, !base), base }); break; }
    case 'tick': S.ticked.has(k) ? S.ticked.delete(k) : S.ticked.add(k); saveTicks(); break;
    case 'cat': S.f.category = k; break;
    case 'clear': S.f = { category: 'all', courier: null, hideDone: false, query: '' }; S.tag = null; break;
    case 'more': S.moreMenu = !S.moreMenu; break;
    case 'sync': S.syncing = true; render(); setTimeout(() => { S.syncing = false; toast('Synced with Shopee'); }, 700); return;
    case 'reset': S.resetting = true; break;
    case 'cancelreset': S.resetting = false; break;
    case 'confirmreset': S.resetting = false; toast('Sync state reset; synced with Shopee'); return;
    case 'export': toast('outbound_scans.csv downloaded (simulated)'); return;
    case 'tag': S.tag = k || null; break;
    case 'dismiss': S.lastClose = null; break;
    case 'selall': { const shown = pairedMode() ? pairedModel().shown : S.scans.filter(tagOk); const all = shown.every((s) => S.selected.has(s.id)); S.selected = all ? new Set() : new Set(shown.map((s) => s.id)); break; }
    case 'scan': { const id = Number(k); S.selected.has(id) ? S.selected.delete(id) : S.selected.add(id); break; }
    case 'openclose': S.closing = true; break;
    case 'cancelclose': S.closing = false; break;
    case 'confirmclose': doClose(); return;
    case 'simscan': simulateScan(); return;
    case 'hview': S.h.view = k; break;
    case 'h7': { const d = (ms) => { const x = new Date(ms); return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}-${String(x.getDate()).padStart(2, '0')}`; }; S.h.from = d(NOW - 6 * 864e5); S.h.to = d(NOW); break; }
    case 'hclose': { const set = norm(S.h.q) ? S.h.shut : S.h.open; set.has(k) ? set.delete(k) : set.add(k); break; }
    case 'hall': S.h.all.has(k) ? S.h.all.delete(k) : S.h.all.add(k); break;
    case 'hdates': S.h.from = ''; S.h.to = ''; break;
    case 'hgoto': S.h.view = 'closes'; S.h.from = ''; S.h.to = ''; S.h.shut.delete(k); S.h.open.add(k); break;
  }
  render();
});
document.addEventListener('input', (e) => {
  const i = e.target.dataset.i; if (!i) return;
  if (i === 'query') S.f.query = e.target.value;
  else if (i === 'courier') S.f.courier = e.target.value || null;
  else if (i === 'hideDone') S.f.hideDone = e.target.checked;
  else if (i === 'hfrom') S.h.from = e.target.value;
  else if (i === 'hto') S.h.to = e.target.value;
  else if (i === 'hq') { if (norm(e.target.value) !== norm(S.h.q)) { S.h.shut = new Set(); S.h.all = new Set(); } S.h.q = e.target.value; }
  render();
});
document.addEventListener('keydown', (e) => {
  const tag = (document.activeElement || {}).tagName;
  if (e.key === '/' && S.tab === 'history' && !['INPUT', 'SELECT', 'TEXTAREA'].includes(tag)) { e.preventDefault(); const el = document.getElementById('hq'); if (el) el.focus(); }
  else if (e.key === 'Escape' && e.target.dataset && e.target.dataset.i === 'hq') { S.h.q = ''; S.h.shut = new Set(); S.h.all = new Set(); render(); }
});
// Prototype only: add an open scan as a WebSocket frame would. Picks a fully picked order that has no scan yet
// (soonest ship-by first), else the missing package of a part-scanned split order, else any order with no scan.
function simulateScan() {
  const packed = packedOrders(S.orders, S.scans), scanned = new Set(S.scans.map((s) => norm(s.content)));
  const unpacked = S.orders.filter((o) => !packed.has(o.order_sn)).sort((a, b) => a.ship_by.localeCompare(b.ship_by));
  let o = unpacked.find((x) => progress(x, S.picks).state === 'done'), label;
  if (o) label = ((o.info || []).find((i) => i.tracking_number) || {}).tracking_number || o.order_sn;
  else {
    o = S.orders.find((x) => packState(x, S.scans) === 'partial');
    if (o) label = o.info.find((i) => i.tracking_number && !scanned.has(norm(i.tracking_number))).tracking_number;
    else { o = unpacked[0]; if (o) label = ((o.info || []).find((i) => i.tracking_number) || {}).tracking_number || o.order_sn; }
  }
  if (!o) { toast('Every ongoing order already has a scan'); return; }
  const id = Math.max(0, ...S.scans.map((s) => s.id), ...S.history.closed_scans.map((s) => s.id)) + 1;
  S.scans.unshift({ id, content: label, tags: o.shipping_carrier ? [o.shipping_carrier] : [], created_at: new Date().toISOString().replace(/\.\d+Z$/, 'Z'),
    owner_user: o.owner_user || 'eko', closed: false, closed_at: null });
  toast(`New scan ${label} packs ${o.order_sn}`);
}
// POST /outbound/close [labels]: the server closes every OPEN scan with a submitted label (also ones hidden by the
// tag filter) and marks done every ongoing order whose SN or tracking number is among the labels. One shared closed_at.
function doClose() {
  const labels = new Set(toClose().map((s) => norm(s.content)));
  const closedAt = new Date().toISOString().replace(/\.\d+Z$/, 'Z');
  const closed = S.scans.filter((s) => labels.has(norm(s.content)));
  const done = S.orders.filter((o) => labelsOf(o).some((l) => labels.has(l)));
  S.scans = S.scans.filter((s) => !closed.includes(s));
  S.orders = S.orders.filter((o) => !done.includes(o));
  for (const s of closed) S.history.closed_scans.push({ ...s, closed: true, closed_at: closedAt });
  for (const o of done) { S.history.orders_done.push({ ...o, done: true, done_at: closedAt }); S.ticked.delete(o.order_sn); S.expand.delete(o.order_sn); }
  saveTicks();
  S.history.closes.unshift({ closed_at: closedAt, outbound: closed.length, orders_done: done.length, tags: [...new Set(closed.flatMap((s) => s.tags || []))].sort() });
  S.lastClose = { outbound: closed.length, orders_done: done.length };
  S.selected = new Set(); S.closing = false;
  toast(`Closed ${closed.length} scans; ${done.length} orders marked done`);
}
render();
</script>

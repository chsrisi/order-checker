# CI for the branch model in docs/archive/BRANCH_SPLIT_REVIEW.md §4.1 / IMPLEMENTATION_PLAN T3.3.
# Required checks and branch protection are repository settings (maintainer task).
name: ci

on:
  pull_request:
    branches: [dev, master]
  push:
    branches: [dev, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (lint, unit, contract, PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bakingholic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bakingholic_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
      redis:
        image: redis:8.8-alpine
        ports: ["6379:6379"]
    env:
      APP_ENV: development
      DATABASE_URL: "sqlite:///:memory:"
      TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/bakingholic_test
      REDIS_URL: redis://localhost:6379/15
      LOG_TO_FILE: "false"
      LOG_FORMAT: text
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: uv sync --locked
      - run: uv run ruff check src tests alembic scripts
      - name: requirements.txt matches uv.lock
        run: |
          uv export --format requirements.txt --no-hashes --no-dev -o /tmp/requirements.txt
          diff <(grep -v '^#' requirements.txt) <(grep -v '^#' /tmp/requirements.txt)
      - run: uv run python -m pytest

  migrations:
    name: migration gate (previous release -> head)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: bakingholic_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d bakingholic_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - run: backend/scripts/ci_migration_gate.sh
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:test@localhost:5432/bakingholic_test

  android:
    # v2 operator app (IMPLEMENTATION_PLAN T6.10). The release build is unsigned in CI until
    # CI signing is set up (V2_SPEC §12.7): -Poc.unsignedRelease=true skips the signing config.
    name: android (client-android)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/client-android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-37.2 build-tools;37.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew --no-daemon lint testDebugUnitTest assembleDebug assembleRelease -Poc.unsignedRelease=true

  flutter:
    name: flutter (${{ matrix.app }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [client, admin]
    defaults:
      run:
        working-directory: frontend/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
          cache: true
      - run: cp .env.example .env
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
